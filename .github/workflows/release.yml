# Tag a release (v1.0.0) to attach firmware for every board to GitHub Releases.
# The release page text comes from the matching section of CHANGELOG.md.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        run: |
          for env in supermini s3mini; do
            pio run -e "$env"
            pio run -t merge -e "$env"
          done

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for env in supermini s3mini; do
            cp ".pio/build/${env}/firmware-merged.bin" "dist/plane-radar-${VERSION}-${env}-full.bin"
            cp ".pio/build/${env}/firmware.bin" "dist/plane-radar-${VERSION}-${env}-ota.bin"
          done
          for image in dist/*.bin; do
            sha256sum "$image" > "${image}.sha256"
          done
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      # The tag v1.2.3 uses the "## [1.2.3]" section of CHANGELOG.md; a manual run, or a
      # version without its own section, uses "## [Unreleased]".
      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="Unreleased"
          fi
          {
            python scripts/changelog_section.py CHANGELOG.md "${VERSION}"
            echo
            cat .github/release-files.md
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
