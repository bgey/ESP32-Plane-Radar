# Tag a release (v1.0.0) to attach firmware for every board to GitHub Releases.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build and merge
        run: |
          for env in supermini s3mini; do
            pio run -e "$env"
            pio run -t merge -e "$env"
          done

      - name: Package release files
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="manual-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for env in supermini s3mini; do
            cp ".pio/build/${env}/firmware-merged.bin" "dist/plane-radar-${VERSION}-${env}-full.bin"
            cp ".pio/build/${env}/firmware.bin" "dist/plane-radar-${VERSION}-${env}-ota.bin"
          done
          for image in dist/*.bin; do
            sha256sum "$image" > "${image}.sha256"
          done
          echo "version=${VERSION}" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Which file do I need?

            Pick the files for **your board**. They are not interchangeable.

            | Board | Display | Files |
            |-------|---------|-------|
            | **s3mini** | Wemos S3 Mini + 4" 480x320 ST7796S touch display | `*-s3mini-full.bin`, `*-s3mini-ota.bin` |
            | **supermini** | ESP32-C3 Super Mini + 1.28" round GC9A01 | `*-supermini-full.bin`, `*-supermini-ota.bin` |

            - `-full.bin`: first install or recovery. Flash at offset `0x0` over USB (for example with [esptool-js](https://espressif.github.io/esptool-js/)). This erases saved settings (Wi-Fi, saved places, touch calibration).
            - `-ota.bin`: later updates, uploaded on the device's web page under **Firmware update**. Keeps your settings.
            - `.sha256`: checksum of the file with the same name.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
